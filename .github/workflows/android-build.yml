name: Android Build

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VersandApp-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Zusätzlich als Release veröffentlichen, damit die APK per Direktlink
      # aufs Handy geladen werden kann (Release "latest-debug" wird bei jedem
      # Push aktualisiert).
      - name: Publish APK to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: VersandApp Debug-Build
          prerelease: true
          body: >
            Automatischer Debug-Build vom letzten Push.
            app-debug.apk herunterladen und auf Android installieren
            (Installation aus unbekannten Quellen erlauben).
          files: app/build/outputs/apk/debug/app-debug.apk
